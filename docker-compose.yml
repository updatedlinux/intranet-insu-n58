# Intranet local / QA — stack completo desacoplado de Nomad.
# Uso: cp .env.example .env && docker compose up --build
#
# Servicios: SQL Server, MinIO, Redis, API, frontend (nginx).
# En Apple Silicon, SQL Server usa platform linux/amd64 (emulación).

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU16-ubuntu-22.04
    platform: linux/amd64
    container_name: intranet-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "${DB_PUBLISH_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      # La imagen oficial no siempre trae sqlcmd; comprobamos el puerto TCP.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/1433'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    networks:
      - intranet

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: intranet-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    ports:
      - "${MINIO_PUBLISH_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    # La imagen MinIO es mínima (sin curl/mc); el entrypoint de la API espera el TCP.
    networks:
      - intranet

  redis:
    image: redis:7-alpine
    container_name: intranet-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command:
      [
        "sh",
        "-c",
        "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\"",
      ]
    ports:
      - "${REDIS_PUBLISH_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - intranet

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: intranet-api
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3000"
      DB_SERVER: sqlserver
      DB_PORT: "1433"
      DB_NAME: ${DB_NAME:-insular_intranet}
      DB_USER: ${DB_USER:-sa}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ENCRYPT: ${DB_ENCRYPT:-false}
      MINIO_ENABLED: "true"
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-insular-docs}
      MINIO_PUBLIC_BASE_URL: ${MINIO_PUBLIC_BASE_URL:-http://localhost:9000/insular-docs}
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      APP_URL: ${APP_URL:-http://localhost:8080}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-intranet_session}
    ports:
      - "${API_PUBLISH_PORT:-3000}:3000"
    depends_on:
      sqlserver:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - intranet

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: intranet-web
    environment:
      BACKEND_ORIGIN: http://api:3000
      NOMAD_PORT_http: "8080"
    ports:
      - "${WEB_PUBLISH_PORT:-8080}:8080"
    depends_on:
      - api
    networks:
      - intranet

volumes:
  sqlserver_data:
  minio_data:
  redis_data:

networks:
  intranet:
    driver: bridge
